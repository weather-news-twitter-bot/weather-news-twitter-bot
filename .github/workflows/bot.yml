name: 🌤️ WNL Timetable Bot

on:
  schedule:
    # 20分おき（UTC）。:00 は混雑で遅延/スキップが多いので外す。
    # GitHub の cron は間引かれる（2026-09-02 は毎時設定で1日3回しか走らず、
    # 5時間半の空白の間に起きた差し替えを取りこぼした）。回数を増やして耐える。
    # 投稿数は変わらない（告知1回/日＋実変更のみ）。処理は冪等なので重なっても安全。
    # 告知(21時JST)/監視は weather_bot.py 側が JST 時刻で判定する。
    - cron: '17,37,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず動作確認（チェックで投稿・コミットをスキップ）'
        type: boolean
        default: false
      announce_test:
        description: '時刻に関係なく翌日告知の判定を走らせる（テスト用）'
        type: boolean
        default: false

# 同時実行を抑止（前のRunが走っててもキューで直列化）
concurrency:
  group: wnl-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # schedule_data.json のコミット用

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        # PyPI 側の接続断（Connection reset by peer）でたまに落ちる。
        # pip 既定のリトライは10秒で打ち止めなので、外側でも間を空けて3回まで試す。
        run: |
          for i in 1 2 3; do
            pip install --retries 5 --timeout 30 -r requirements.txt && exit 0
            echo "pip install 失敗 ($i/3)。20秒待って再試行"
            sleep 20
          done
          echo "::error::pip install が3回とも失敗（PyPI 到達不能）"
          exit 1

      - name: Run bot (reconcile)
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          SKIP_TWEET_FLAG: ${{ github.event.inputs.dry_run }}
          ANNOUNCE_TEST: ${{ github.event.inputs.announce_test }}
          TZ: 'Asia/Tokyo'
        run: python src/weather_bot.py

      - name: Commit schedule state & history
        if: success() && github.event.inputs.dry_run != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'BOT: update schedule state'
          file_pattern: schedule_data.json history.jsonl
