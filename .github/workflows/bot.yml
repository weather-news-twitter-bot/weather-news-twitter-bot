name: 🌤️ WNL Timetable Bot

on:
  # 2026-09-16 から定時実行は NAS（DS220j）のタスクスケジューラに移した
  # （scripts/nas_run.sh。投稿も記録も NAS が1台でやる）。ここに cron を残すと
  # 書き手が2つになって schedule_data.json / history.jsonl が食い違うので外した。
  # 手動実行（dry-run の確認用）だけ残す。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず動作確認（チェックで投稿・コミットをスキップ）'
        type: boolean
        default: false
      announce_test:
        description: '時刻に関係なく翌日告知の判定を走らせる（テスト用）'
        type: boolean
        default: false

# 同時実行を抑止（前のRunが走っててもキューで直列化）
concurrency:
  group: wnl-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # schedule_data.json のコミット用

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        # PyPI 側の接続断（Connection reset by peer）でたまに落ちる。
        # pip 既定のリトライは10秒で打ち止めなので、外側でも間を空けて3回まで試す。
        run: |
          for i in 1 2 3; do
            pip install --retries 5 --timeout 30 -r requirements.txt && exit 0
            echo "pip install 失敗 ($i/3)。20秒待って再試行"
            sleep 20
          done
          echo "::error::pip install が3回とも失敗（PyPI 到達不能）"
          exit 1

      - name: Run bot (reconcile)
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          SKIP_TWEET_FLAG: ${{ github.event.inputs.dry_run }}
          ANNOUNCE_TEST: ${{ github.event.inputs.announce_test }}
          # 2026-09-11 に X API が従量課金になり（402 credits depleted）、ここからは
          # 投稿しない。告知はローカル PC の src/tweet_local.py（ブラウザ経由）が
          # 21時に1回だけ出す。ここは番組表の記録（full / final / history）だけ続ける。
          TWEET_VIA: none
          TZ: 'Asia/Tokyo'
        run: python src/weather_bot.py

      - name: Commit schedule state & history
        if: success() && github.event.inputs.dry_run != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'BOT: update schedule state'
          file_pattern: schedule_data.json history.jsonl
